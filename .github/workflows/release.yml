name: Release

on:
  push:
    tags:
      - 'v*'
      - 'macos-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to release (e.g. macos-v0.1.22 or v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release px0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        env:
          INPUT_TAG: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^(macos-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable tag: macos-vX.Y.Z or vX.Y.Z" >&2
            exit 1
          fi
          # Always build the tagged source, including manual dispatches.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          VER="${TAG#macos-}"
          VER="${VER#v}"
          if [ "$(tr -d '[:space:]' < VERSION)" != "$VER" ]; then
            echo "VERSION must match $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          if [[ "$TAG" == macos-v* ]]; then
            echo 'targets=darwin/amd64 darwin/arm64' >> $GITHUB_OUTPUT
          else
            echo 'targets=linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 windows/386 freebsd/amd64 freebsd/arm64 openbsd/amd64 openbsd/arm64 netbsd/amd64' >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle Web Assets
        run: |
          node ./scripts/build-web.js

      - name: Build Cross-Platform Binaries
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TARGETS: ${{ steps.get_version.outputs.targets }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          if [ -n "$POSTHOG_KEY" ]; then
            LDFLAGS="$LDFLAGS -X main.posthogKey=$POSTHOG_KEY"
          fi
          for t in $TARGETS; do
            os=${t%/*}
            arch=${t#*/}
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            name="px0-${VERSION}-${os}-${arch}${ext}"
            printf "Building %-28s ... " "$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$LDFLAGS" -o "dist/$name" .
            printf "done (%s)\n" "$(du -h "dist/$name" | cut -f1)"
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum px0-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/px0-*
            dist/checksums.txt
